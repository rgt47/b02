datasets:
  - id: 1
    name: "Penguin Dataset"
    short_name: "Penguins"
    data_url: "https://github.com/rfordatascience/tidytuesday/blob/main/data/2020/2020-07-28/readme.md"
    references:
      - title: "Palmer Archipelago Penguins Data in the palmerpenguins R Package"
        url: "https://journal.r-project.org/articles/RJ-2022-020/"

  - id: 2
    name: "ADNI Dataset"
    short_name: "ADNI"
    data_url: "https://adni.loni.usc.edu/data-samples/adni-data/"
    references:
      - title: "Predicting conversion to Alzheimer's disease in individuals with Mild Cognitive Impairment using clinically transferable features"
        url: "https://www.nature.com/articles/s41598-022-18805-5"

  - id: 3
    name: "Stanford Open Policing Project"
    short_name: "Policing"
    data_url: "https://openpolicing.stanford.edu/data/"
    description: "Standardized data on vehicle and pedestrian stops from law enforcement departments across the United States."
    references:
      - title: "Racial disparities in police stops in US cities"
        citation: "Rivera R, Rosenbaum J. Significance. 2020;17(4):4-5."
        url: "https://rss.onlinelibrary.wiley.com/doi/full/10.1111/1740-9713.01412"
      - title: "A large-scale analysis of racial disparities in police stops across the United States"
        citation: "Pierson E, Simoiu C, Overgoor J, et al. Nature Human Behaviour. 2020;4(7):736-745."
        url: "https://doi.org/10.1038/s41562-020-0858-1"

  - id: 4
    name: "Licorice Gargle"
    short_name: "Licorice"
    data_url: "https://higgi13425.github.io/medicaldata/"
    description: "A Randomized, Double-Blind Comparison of Licorice Versus Sugar-Water Gargle for Prevention of Postoperative Sore Throat and Postextubation Coughing"
    references:
      - title: "Licorice gargle RCT"
        url: "https://pubmed.ncbi.nlm.nih.gov/23921656/"

